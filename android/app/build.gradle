// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google() // Google's Maven repository
        mavenCentral() // Maven Central repository
    }

    dependencies {
        // Add the Google services classpath for Firebase
        classpath 'com.google.gms:google-services:4.3.15' // Ensure correct version
    }
}

// Apply the Android and Kotlin Gradle plugins
plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// Make sure you add the google-services plugin at the end of this file
apply plugin: 'com.google.gms.google-services'

android {
    // Namespace for the app, should match the applicationId
    namespace = "com.project.loginpage" // Correct applicationId

    compileSdk = 33 // Specify the compile SDK version

    defaultConfig {
        applicationId = "com.project.loginpage" // Ensure this matches the Firebase configuration
        minSdk = 21 // Minimum SDK version
        targetSdk = 33 // Target SDK version
        versionCode = 1 // Version code for the app
        versionName = 1.0 // Version name for the app
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8 // Java version compatibility
        targetCompatibility = JavaVersion.VERSION_1_8 // Java version compatibility
    }

    buildTypes {
        release {
            // Configurations for the release build
            signingConfig = signingConfigs.debug // Use debug signing config
            minifyEnabled false // Disable code shrinking
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' // ProGuard files
        }
    }
}

// Dependencies for the app
dependencies {
    // Firebase platform BoM to manage versions of Firebase libraries
    implementation platform('com.google.firebase:firebase-bom:31.0.2')

    // Add Firebase dependencies
    implementation 'com.google.firebase:firebase-analytics' // Firebase Analytics
    implementation 'com.google.firebase:firebase-auth' // Firebase Authentication
    implementation 'com.google.firebase:firebase-firestore' // Firebase Firestore
}

// Make sure this is at the end of the file
apply plugin: 'com.google.gms.google-services'
